name: Build & Release Za Stampu

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

jobs:

  build-windows:
    runs-on: windows-latest
    name: Build Windows (.exe)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalacija paketa
        run: npm install

      - name: Build Windows installer
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: za-stampu-windows
          path: dist/*.exe
          retention-days: 30

      - name: Kompajliranje keygen
        run: cd keygen && g++ keygen.cpp -o keygen.exe -std=c++17 -static -static-libgcc -static-libstdc++
        continue-on-error: true

      - name: Upload keygen
        uses: actions/upload-artifact@v4
        with:
          name: keygen-windows
          path: keygen/keygen.exe
          retention-days: 30
        continue-on-error: true

  build-linux:
    runs-on: ubuntu-latest
    name: Build Linux (AppImage)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalacija sistem paketa
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libnotify-dev libnss3 libxss1 libasound2

      - name: Instalacija npm paketa
        run: npm install

      - name: Build Linux
        run: npm run build:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: za-stampu-linux
          path: |
            dist/*.AppImage
            dist/*.deb
          retention-days: 30

      - name: Kompajliranje keygen
        run: cd keygen && g++ keygen.cpp -o keygen -std=c++17 && chmod +x keygen

      - name: Upload keygen
        uses: actions/upload-artifact@v4
        with:
          name: keygen-linux
          path: keygen/keygen
          retention-days: 30

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    name: Kreiraj GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: za-stampu-windows
          path: release/windows

      - uses: actions/download-artifact@v4
        with:
          name: za-stampu-linux
          path: release/linux

      - uses: actions/download-artifact@v4
        with:
          name: keygen-windows
          path: release/keygen-win
        continue-on-error: true

      - uses: actions/download-artifact@v4
        with:
          name: keygen-linux
          path: release/keygen-linux
        continue-on-error: true

      - uses: softprops/action-gh-release@v2
        with:
          name: "Za Stampu ${{ github.ref_name }}"
          body: |
            ## Za Stampu ${{ github.ref_name }}
            ### Preuzimanje
            - Windows: `Za Stampu Setup 1.0.0.exe`
            - Linux: `Za Stampu-1.0.0.AppImage`
          files: |
            release/windows/*
            release/linux/*
            release/keygen-win/*
            release/keygen-linux/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
